<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <title>Confirm Desktop Login</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #2a2a2a;
      --elevated: #1a1a1a;
      --border: #333;
      --muted: #b0b0b0;
      --accent: #667eea;
      --accent-2: #764ba2;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      text-align: center;
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    h2, h3, p { margin: 0 0 12px; }
    .user-info {
      margin: 20px 0;
      padding: 16px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .user-info p { color: var(--muted); margin: 0; }
    .user-info h3 { margin: 6px 0; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      margin-top: 8px;
      padding: 12px 24px;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .ok { color: #4ade80; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Desktop Login</h2>
    <div id="content"><p>Loading...</p></div>
  </div>

  <script>
    (function () {
      var content = document.getElementById("content");
      var sessionId = new URLSearchParams(window.location.search).get("sessionId");

      function el(tag, text, className) {
        var node = document.createElement(tag);
        if (text !== undefined) node.textContent = text; // textContent => no HTML injection
        if (className) node.className = className;
        return node;
      }

      function show() {
        content.replaceChildren.apply(content, arguments);
      }

      function loginLink() {
        var a = el("a", "Go to Login", "btn");
        a.href = "/login";
        return a;
      }

      function readStorage(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      if (!sessionId) {
        show(el("p", "Invalid QR code: missing session.", "err"));
        return;
      }

      var token = readStorage("token");
      var user = null;
      try { user = JSON.parse(readStorage("user") || "null"); } catch (e) {}

      if (!token || !user) {
        show(
          el("p", "You are not logged in on this device.", "err"),
          el("p", "Log in first, then scan the QR code again."),
          loginLink()
        );
        return;
      }

      var result = el("div");
      result.style.marginTop = "20px";
      var button = el("button", "Yes, Log Me In", "btn");

      var info = el("div", undefined, "user-info");
      info.appendChild(el("p", "You are logged in as:"));
      info.appendChild(el("h3", user.name || "User"));
      info.appendChild(el("p", user.email || ""));

      button.addEventListener("click", function () {
        button.disabled = true;
        result.replaceChildren(el("p", "Confirming login..."));

        fetch("/api/qr/confirm", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ sessionId: sessionId })
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (data) {
              return { ok: r.ok, status: r.status, data: data };
            });
          })
          .then(function (res) {
            if (res.ok) {
              result.replaceChildren(
                el("p", "Success! You can now return to your desktop.", "ok")
              );
            } else if (res.status === 401) {
              result.replaceChildren(
                el("p", "Your session on this device has expired. Please log in again.", "err"),
                loginLink()
              );
            } else {
              button.disabled = false;
              result.replaceChildren(
                el("p", (res.data && (res.data.msg || res.data.message)) || "Something went wrong.", "err")
              );
            }
          })
          .catch(function (e) {
            button.disabled = false;
            result.replaceChildren(el("p", "Network error: " + e.message, "err"));
          });
      });

      show(
        el("h3", "Confirm Desktop Login"),
        info,
        el("p", "Do you want to log in to your desktop with this account?"),
        button,
        result
      );
    })();
  </script>
</body>
</html>
